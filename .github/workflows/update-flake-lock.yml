name: Update flake.lock

on:
  schedule:
    # runs-on and timeout-minutes cannot read env, so the weekly cron string is
    # repeated in the job's mode checks below; change all four together.
    - cron: "0 23 * * *"
    - cron: "0 18 * * 5"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [daily, weekly]
        default: daily

permissions:
  contents: write

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ${{ (github.event.schedule == '0 18 * * 5' || inputs.mode == 'weekly') && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: ${{ (github.event.schedule == '0 18 * * 5' || inputs.mode == 'weekly') && 360 || 20 }}
    env:
      WEEKLY: ${{ github.event.schedule == '0 18 * * 5' || inputs.mode == 'weekly' }}
      DAILY_INPUTS: nix-claude-code mo-nix mise-nix codex-nix ctx-nix
      WEEKLY_INPUTS: nixpkgs home-manager nix-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update inputs
        id: update
        run: |
          inputs="$DAILY_INPUTS"
          if [ "$WEEKLY" = true ]; then inputs="$inputs $WEEKLY_INPUTS"; fi
          # shellcheck disable=SC2086
          nix flake update $inputs
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build darwin systems
        if: env.WEEKLY == 'true' && steps.update.outputs.changed == 'true'
        run: |
          df -h / /nix
          nix build --no-link .#darwinConfigurations.private.system .#darwinConfigurations.work.system
          df -h / /nix

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$WEEKLY" = true ]; then msg='Update nixpkgs and flake inputs'; else msg='Update flake inputs'; fi
          git commit -m "$msg" -- flake.lock
          # No rebase onto a newer main: the weekly push must be the exact tree that was built.
          # If main moved during the run, the push is rejected and the next run retries.
          git push origin HEAD:main
