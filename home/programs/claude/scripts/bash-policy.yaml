# The Obsidian vault's private directory is deliberately not gated here. Blocking it at this layer
# means matching a bare path string, which fires on any command that merely mentions the directory —
# grepping this repository included — and still misses the obsidian CLI, which resolves by note name
# rather than by path. The Read deny in settings.json covers Read, Edit, Glob, and Grep without that.

rules:
  - pattern: "git -C *"
    message: "Do not use 'git -C <path>'. Use 'cd <path> && git <subcmd>' instead (see CLAUDE.md)."
